[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bonfires"
version = "0.2.0"
description = "Terminal interface for the Bonfires AI API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "NERDDAO", email = "dev@bonfires.ai" }]
keywords = ["bonfires", "ai", "knowledge-graph", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://bonfires.ai"
Repository = "https://github.com/NERDDAO/bonfire-cli"
Issues = "https://github.com/NERDDAO/bonfire-cli/issues"

[project.scripts]
bonfire = "bonfires.cli:cli"
