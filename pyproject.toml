[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bonfire-cli"
version = "0.1.0"
description = "Beautiful terminal interface for the Bonfires API"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.scripts]
bonfire = "bonfire:cli"
