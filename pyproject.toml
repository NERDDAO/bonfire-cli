[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bonfires"
version = "0.2.0"
description = "Terminal interface for the Bonfires AI API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["bonfires", "ai", "knowledge-graph", "cli"]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/NERDDAO/bonfire-cli"

[project.scripts]
bonfire = "bonfires.cli:cli"
